<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeCopy Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">SafeCopy Settings</h1>
        
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Source Folder</h5>
                <button class="btn btn-warning" id="run-backup-btn">
                    <i class="bi bi-play-fill"></i> Run Backup Now
                </button>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="source-input" class="form-control" placeholder="Select source folder" readonly>
                    <button class="btn btn-primary" id="browse-btn">Browse</button>
                </div>
                
                <div id="folder-preview" class="folder-preview" style="display: none;">
                    <div class="folder-preview-header">
                        <h6 class="mb-0">Folder Preview</h6>
                        <button class="btn btn-sm btn-outline-secondary" id="refresh-preview">Refresh</button>
                    </div>
                    <div id="folder-preview-content" class="folder-preview-content"></div>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Destination Folder</h5>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="destination-input" class="form-control" placeholder="Select destination folder" readonly>
                    <button class="btn btn-primary" id="browse-dest-btn">Browse</button>
                </div>
                
                <div id="destination-preview" class="folder-preview" style="display: none;">
                    <div class="folder-preview-header">
                        <h6 class="mb-0">Folder Preview</h6>
                        <button class="btn btn-sm btn-outline-secondary" id="refresh-dest-preview">Refresh</button>
                    </div>
                    <div id="destination-preview-content" class="folder-preview-content"></div>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Folder Mappings</h5>
            </div>
            <div class="card-body">
                <div id="mapping-list" class="mapping-list">
                    <!-- Mappings will be added here dynamically -->
                </div>
                
                <div class="mt-3">
                    <button class="btn btn-success" id="add-mapping">Add Mapping</button>
                    <button class="btn btn-primary" id="save-mappings">Save Mappings</button>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Action Log</h5>
            </div>
            <div class="card-body">
                <div id="action-log" class="action-log">
                    <!-- Action log entries will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Folder Browser Modal -->
    <div id="folder-browser" class="folder-browser" style="display: none;">
        <div class="folder-browser-content">
            <div class="folder-browser-header">
                <h5 class="mb-0">Browse Folders</h5>
                <div class="folder-browser-actions">
                    <button class="btn btn-sm btn-outline-secondary" id="up-btn">Up</button>
                    <button class="btn btn-sm btn-outline-secondary" id="cancel-btn">Cancel</button>
                    <button class="btn btn-sm btn-primary" id="select-btn" disabled>Select</button>
                </div>
            </div>
            <div class="folder-browser-path">
                <input type="text" id="current-path" class="form-control" readonly>
            </div>
            <div id="folder-list" class="folder-list">
                <!-- Folders will be listed here -->
            </div>
        </div>
    </div>
    
    <!-- Backup Progress Modal -->
    <div class="modal fade" id="backup-progress-modal" tabindex="-1" aria-labelledby="backup-progress-modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="backup-progress-modal-label">Backup in Progress</h5>
                </div>
                <div class="modal-body">
                    <div class="progress mb-3">
                        <div id="backup-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div id="backup-status" class="text-center">Preparing backup...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/folder-browser.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
